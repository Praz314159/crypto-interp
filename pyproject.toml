[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto_interp"
version = "0.1.0"
description = "Mechanistic interpretability of cryptographically-important algorithms learned by small transformers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prashanth Ramakrishna" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "einops>=0.7",
    "matplotlib>=3.8",
    "jaxtyping>=0.2.25",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.scripts]
crypto-interp = "crypto_interp.cli:main"

[project.optional-dependencies]
# ruff is pinned exactly so local and CI format identically.
dev = ["pytest>=8", "ruff==0.17.1"]

[tool.setuptools.package-data]
"crypto_interp.viz" = ["assets/*"]

[tool.setuptools.packages.find]
include = ["crypto_interp*"]
exclude = ["experiments*", "scripts*", "notes*", "papers*", "infra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Legacy per-experiment scripts are archived in a later PR rather than linted.
extend-exclude = ["experiments/*/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# F722: jaxtyping shape strings ("batch pos d") are not forward references.
ignore = ["F722"]
